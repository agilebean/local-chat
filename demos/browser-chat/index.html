<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Chat — local LLM in your browser</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #8a92a4;
      --accent: #6ea8ff;
      --user: #2563eb;
      --assistant: #2a2f3a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    header { margin-bottom: 12px; }
    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 13px; }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 12px;
      flex-wrap: wrap;
    }
    select, button, input[type="text"] {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
    }
    select { cursor: pointer; min-width: 280px; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #0f1115; border-color: var(--accent); font-weight: 600; }
    .controls label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
    #status {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 280px;
    }
    .msg {
      max-width: 85%;
      padding: 9px 13px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user { background: var(--user); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.assistant { background: var(--assistant); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg .role { font-size: 11px; opacity: 0.7; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .composer { display: flex; gap: 8px; margin-top: 12px; }
    #input { flex: 1; }
    #input:focus { outline: none; border-color: var(--accent); }
    .footer { margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Browser Chat</h1>
      <div class="subtitle">A tiny local LLM running in your browser via WebGPU. No server, no API key.</div>
    </header>

    <div class="controls">
      <select id="model"></select>
      <button id="start" class="primary">Load model</button>
      <label><input type="checkbox" id="speak" checked /> speak replies</label>
      <button id="reset" type="button">Reset chat</button>
    </div>

    <div id="status">Idle. Click "Load model" to begin (one-time download to your browser cache).</div>

    <div id="chat" aria-live="polite"></div>

    <div class="composer">
      <input id="input" type="text" placeholder="Type and press Enter..." disabled autocomplete="off" />
      <button id="send" disabled>Send</button>
    </div>

    <div class="footer">
      Requires Chrome 113+, Edge, or Safari 26+ (WebGPU). First load downloads ~350 MB
      to your browser, then runs offline.
    </div>
  </main>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const chatEl = $("chat");
    const inputEl = $("input");
    const sendBtn = $("send");
    const startBtn = $("start");
    const resetBtn = $("reset");
    const modelSel = $("model");
    const speakChk = $("speak");

    let engine = null;
    let cfg = null;
    let systemPrompt = "";
    let messages = [];

    async function bootstrap() {
      try {
        cfg = await fetch("llm_config.json").then(r => r.json());
        systemPrompt = (await fetch(cfg.system_prompt_file).then(r => r.text())).trim();
        for (const m of cfg.alternatives) {
          modelSel.appendChild(new Option(m, m, m === cfg.model, m === cfg.model));
        }
        if (!("gpu" in navigator)) {
          statusEl.textContent = "WebGPU is not available in this browser. Use Chrome 113+, Edge, or Safari 26+.";
          startBtn.disabled = true;
        }
      } catch (e) {
        statusEl.textContent = "Failed to load demo files: " + e.message + " (did you start a local server? see README)";
      }
    }

    function append(role, content) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.innerHTML = `<div class="role">${role}</div>${escape(content)}`;
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
      return el;
    }

    function escape(s) {
      return s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    }

    function speak(text) {
      if (!speakChk.checked || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }

    function resetConversation() {
      messages = [{ role: "system", content: systemPrompt }];
      chatEl.innerHTML = "";
      if (engine) statusEl.textContent = `Ready — ${modelSel.value}. Say something.`;
    }

    startBtn.addEventListener("click", async () => {
      const model = modelSel.value;
      startBtn.disabled = true;
      modelSel.disabled = true;
      try {
        engine = await CreateMLCEngine(model, {
          initProgressCallback: (r) => { statusEl.textContent = r.text; }
        });
        resetConversation();
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      } catch (e) {
        statusEl.textContent = "Load failed: " + e.message;
        startBtn.disabled = false;
        modelSel.disabled = false;
      }
    });

    resetBtn.addEventListener("click", () => { if (engine) resetConversation(); });

    async function send() {
      const text = inputEl.value.trim();
      if (!engine || !text) return;
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;
      append("user", text);
      messages.push({ role: "user", content: text });

      const target = append("assistant", "");
      let acc = "";
      try {
        const stream = await engine.chat.completions.create({
          messages,
          stream: true,
          temperature: cfg.temperature ?? 0.7,
          max_tokens: cfg.max_tokens ?? 120,
        });
        for await (const chunk of stream) {
          const delta = chunk.choices?.[0]?.delta?.content || "";
          if (delta) {
            acc += delta;
            target.innerHTML = `<div class="role">assistant</div>${escape(acc)}`;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        }
        messages.push({ role: "assistant", content: acc });
        speak(acc);
      } catch (e) {
        target.textContent = "Error: " + e.message;
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

    bootstrap();
  </script>
</body>
</html>
